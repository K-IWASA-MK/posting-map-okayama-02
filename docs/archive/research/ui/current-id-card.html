<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>POSTING MAP - Official Distributor ID Card (Real Device SSOT)</title>

  <!-- External Stylesheets & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./current-id-card.css">
</head>
<body class="bg-[#000000] text-white font-sans antialiased overflow-hidden select-none p-4 flex justify-center items-center min-h-screen">

  <!-- MAIN APP CONTAINER -->
  <div id="app" class="w-full max-w-[390px] h-[844px] bg-[#000000] flex flex-col justify-between p-4 relative">
    
    <!-- 1. HEADER HUD CONTAINER -->
    <header id="header-hud" class="w-full bg-[#1C1C1E] border border-white/10 rounded-full px-5 py-3 flex items-center justify-between shadow-2xl">
      <div class="flex items-center gap-2 text-xs font-black">
        <span class="text-white/40">全体進捗</span>
        <span class="text-white font-mono">0/ 858</span>
      </div>
      <div class="flex items-center gap-2 text-xs font-black">
        <span class="text-[#22c55e] text-[10px] font-mono">ONLINE</span>
        <div class="w-2 h-2 bg-[#22c55e] rounded-full shadow-[0_0_8px_#22c55e]"></div>
        <span class="text-[#2563eb] font-mono">0%</span>
      </div>
    </header>

    <!-- 2. ID TITLE SECTION -->
    <div id="id-title-section" class="w-full flex items-center justify-center gap-4 py-2">
      <h2 class="text-sm font-black text-white tracking-widest">公式配布員</h2>
      <div class="px-4 py-1.5 rounded-full bg-[#2563eb]/10 border border-[#2563eb]/30 shadow-[0_0_15px_rgba(37,99,235,0.3)]">
        <span class="text-xs font-black text-[#2563eb] font-mono tracking-widest">STAFF ID 001</span>
      </div>
    </div>

    <!-- 3. MAIN OFFICIAL ID CARD (CENTRAL CARD) -->
    <main id="id-card-main" class="gyro-card w-full bg-[#1C1C1E] border border-white/10 rounded-[2.5rem] p-6 flex flex-col items-center justify-between text-center space-y-6 shadow-2xl relative overflow-hidden">
      
      <!-- AUTHORIZED BADGE -->
      <div class="flex items-center gap-2 pt-2">
        <div class="w-2 h-2 bg-[#22c55e] rounded-full shadow-[0_0_8px_#22c55e]"></div>
        <span class="text-[10px] font-black text-[#22c55e] uppercase tracking-[0.2em] font-mono">AUTHORIZED STAFF</span>
      </div>

      <!-- AVATAR IMAGE CONTAINER -->
      <div class="w-32 h-32 rounded-full overflow-hidden border-2 border-white/10 shadow-2xl">
        <img src="https://images.unsplash.com/photo-1544551763-46a013bb70d5?q=80&w=300" alt="Avatar" class="w-full h-full object-cover">
      </div>

      <!-- NAME & ORGANIZATION -->
      <div class="space-y-2">
        <h1 class="text-3xl font-black text-white tracking-tight">K. IWASA</h1>
        <div class="text-[11px] font-bold text-white/40 tracking-widest font-mono space-y-0.5">
          <p>MIE-03 支部</p>
          <p>FIELD OPERATIONS</p>
        </div>
      </div>

      <!-- FOOTER LINKS -->
      <div class="flex items-center justify-center gap-6 pt-4 border-t border-white/5 w-full text-[9px] font-black text-white/30 tracking-widest font-mono">
        <span>TERMS</span>
        <span>PRIVACY</span>
        <span>LICENSE</span>
      </div>
    </main>

    <!-- 4. BOTTOM FLOATING NAVIGATION BAR -->
    <nav id="bottom-nav" class="w-full bg-[#1C1C1E] border border-white/10 rounded-full p-3 flex items-center justify-around shadow-2xl">
      <div class="flex flex-col items-center gap-1 opacity-40">
        <span class="text-lg">🗺️</span>
        <span class="text-[10px] font-bold">エリア</span>
      </div>
      <div class="flex flex-col items-center gap-1 opacity-40">
        <span class="text-lg">🏆</span>
        <span class="text-[10px] font-bold">ランキング</span>
      </div>
      <div class="flex flex-col items-center gap-1 opacity-100">
        <span class="text-lg">👤</span>
        <span class="text-[10px] font-bold text-white">ID</span>
      </div>
      <div class="flex flex-col items-center gap-1 opacity-40">
        <span class="text-lg">⚙️</span>
        <span class="text-[10px] font-bold">次へ</span>
      </div>
    </nav>

  </div>

</body>
</html>
